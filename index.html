<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Hopper 3D - Lab 5</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="statusOverlay">▶ W GRZE (Spacja: Pauza)</div>
    <div id="boostPopup" role="status" aria-live="polite" aria-atomic="true">
        <span class="boost-popup-icon" aria-hidden="true">⚡</span>
        <span class="boost-popup-copy">
            <strong>BOOST ZEBRANY!</strong>
            <span>Szczury zwalniają do 1× na 5 sekund</span>
        </span>
    </div>
    <div id="explosionBurst" aria-hidden="true"></div>
    <div id="explosionFlash" aria-hidden="true"></div>
    <div id="gameOverOverlay" hidden role="status" aria-live="assertive">
        <div class="game-over-card">
            <strong>GAME OVER</strong>
            <span id="gameOverScore"></span>
            <span id="gameOverMessage"></span>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <span id="score">Punkty: 0</span>
        <span id="bestScore">Najlepszy wynik: 0</span>
        <span id="lives">Życia: ❤️❤️❤️ (3/3)</span>
        <div id="worldStats">
            <span id="activeRows">Pasy: 0</span>
            <span id="activeCars">Szczury: 0</span>
            <span id="speed">Szczury 1.00×</span>
        </div>
        <span id="status"></span>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
